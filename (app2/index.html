<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abaddon App 2 - Receiver Node</title>
    <style>
        body {
            background-color: #030406;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            padding-top: 20vh;
            margin: 0;
        }
        .container {
            background: #120a17;
            border: 1px solid rgba(255, 42, 42, 0.2);

            color: #00ff66;
            font-family: monospace;

<body>
    <div class="container">
        <h2>📱 تطبيق العقدة الثانية (App 2)</h2>

        <div id="dataScreen" class="status">[*] في انتظار استقبال الحزم عبر Supabase API...</div>
    </div>

    <script>
        // محاكاة استقبال البيانات المتزامنة من قاعدة البيانات
        setTimeout(() => {
            document.getElementById('dataScreen').innerHTML = "[✔] تم استقبال الحزمة بنجاح من App 1 وتحديث الواجهة!";
